<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hlášení závad - SVJ Navigátorů 612-614</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .defect-container {
      max-width: 700px;
      margin: 2rem auto;
      padding: 0 1.5rem;
    }

    .defect-form {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 2rem;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border);
    }

    .defect-form h1 {
      font-size: 1.75rem;
      margin-bottom: 0.5rem;
      color: var(--text);
    }

    .defect-form > p {
      color: var(--text-light);
      margin-bottom: 2rem;
      font-size: 0.95rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 500;
      color: var(--text);
      font-size: 0.9rem;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 1rem;
      transition: all 0.2s;
      background: var(--surface);
      color: var(--text);
      font-family: inherit;
    }

    .form-group input:disabled,
    .form-group select:disabled {
      background: #f1f5f9;
      cursor: not-allowed;
      opacity: 0.8;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(30, 64, 175, 0.1);
    }

    .form-group input::placeholder,
    .form-group textarea::placeholder {
      color: var(--text-light);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 120px;
    }

    .radio-group {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .radio-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .radio-item input[type="radio"] {
      width: auto;
      padding: 0;
      border: none;
      cursor: pointer;
    }

    .radio-item label {
      margin-bottom: 0;
      cursor: pointer;
      font-weight: 400;
    }

    .file-input-wrapper {
      position: relative;
    }

    .file-input-wrapper input[type="file"] {
      display: none;
    }

    .file-button {
      display: inline-block;
      padding: 0.75rem 1rem;
      background: var(--primary-light);
      color: white;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
    }

    .file-button:hover {
      background: var(--primary);
    }

    .file-name {
      margin-top: 0.5rem;
      font-size: 0.9rem;
      color: var(--text-light);
    }

    .btn-submit {
      width: 100%;
      padding: 0.75rem;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 1rem;
    }

    .btn-submit:hover:not(:disabled) {
      background: var(--primary-dark);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .alert {
      padding: 1rem;
      border-radius: 6px;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
      display: none;
    }

    .alert.show {
      display: block;
    }

    .alert-error {
      background: #fee2e2;
      border: 1px solid #fecaca;
      color: #dc2626;
    }

    .alert-success {
      background: #dcfce7;
      border: 1px solid #bbf7d0;
      color: #16a34a;
    }

    .loading-spinner {
      display: none;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 0.5rem;
    }

    .btn-submit.loading .loading-spinner {
      display: inline-block;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    .help-text {
      font-size: 0.85rem;
      color: var(--text-light);
      margin-top: 0.3rem;
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="container nav-container">
      <a href="./index.html" class="logo">SVJ <span>Navigátorů 612-614</span></a>
      <button class="nav-toggle" id="navToggle" aria-label="Menu"><span></span><span></span><span></span></button>
      <nav class="nav" id="nav">
        <a href="./index.html" class="nav-link">Domů</a>
        <a href="./clanky.html" class="nav-link">Články</a>
        <a href="./udalosti.html" class="nav-link">Události</a>
        <a href="./hlasovani.html" class="nav-link">Hlasování</a>
        <a href="./zavady.html" class="nav-link active">Závady</a>
        <a href="./dokumenty.html" class="nav-link">Další</a>
        <a href="./o-spolecenstvi.html" class="nav-link">O společenství</a>
        <a href="./ucet.html" class="nav-link">Můj účet</a>
      </nav>
    </div>
  </header>

  <div class="defect-container">
    <a href="./index.html" class="back-link">← Zpět na domů</a>

    <div class="defect-form">
      <h1>Hlášení závady</h1>
      <p>Nahlaste závadu nebo poškození v domě</p>

      <div class="alert alert-error" id="errorAlert"></div>
      <div class="alert alert-success" id="successAlert"></div>

      <form id="defectForm">
        <!-- Email -->
        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            placeholder="Váš email"
            required
            disabled
          />
          <div class="help-text">Načteno z vašeho účtu</div>
        </div>

        <!-- Telefon -->
        <div class="form-group">
          <label for="phone">Telefon</label>
          <input
            type="tel"
            id="phone"
            placeholder="Váš telefon"
            required
            disabled
          />
          <div class="help-text">Načteno z vašeho účtu</div>
        </div>

        <!-- Jednotka -->
        <div class="form-group">
          <label for="unit">Číslo jednotky/bytu</label>
          <input
            type="text"
            id="unit"
            placeholder="Např. 101, 102"
            required
            disabled
          />
          <div class="help-text">Načteno z vašeho účtu</div>
        </div>

        <!-- Kategorie -->
        <div class="form-group">
          <label for="category">Kategorie závady</label>
          <select id="category" required>
            <option value="">-- Vyber kategorii --</option>
            <option value="Údržba/Opravy">Údržba/Opravy</option>
            <option value="Vytápění/Voda">Vytápění/Voda</option>
            <option value="Elektrika">Elektrika</option>
            <option value="Bezpečnost">Bezpečnost</option>
          </select>
        </div>

        <!-- Popis -->
        <div class="form-group">
          <label for="description">Popis problému</label>
          <textarea
            id="description"
            placeholder="Podrobně popište problém..."
            required
          ></textarea>
        </div>

        <!-- Urgentnost -->
        <div class="form-group">
          <label>Urgentnost</label>
          <div class="radio-group">
            <div class="radio-item">
              <input
                type="radio"
                id="urgency-normal"
                name="urgency"
                value="Normální"
                checked
              />
              <label for="urgency-normal">Normální</label>
            </div>
            <div class="radio-item">
              <input
                type="radio"
                id="urgency-high"
                name="urgency"
                value="Vysoká"
              />
              <label for="urgency-high">Vysoká</label>
            </div>
            <div class="radio-item">
              <input
                type="radio"
                id="urgency-critical"
                name="urgency"
                value="Velmi vysoká"
              />
              <label for="urgency-critical">Velmi vysoká</label>
            </div>
          </div>
        </div>

        <!-- Fotka -->
        <div class="form-group">
          <label>Fotografie (optional)</label>
          <div class="file-input-wrapper">
            <input
              type="file"
              id="photo"
              accept="image/*"
            />
            <label for="photo" class="file-button">📷 Vybrat fotku</label>
            <div class="file-name" id="fileName"></div>
          </div>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">
          <span class="loading-spinner"></span>
          Odeslat hlášení
        </button>
      </form>
    </div>
  </div>

  <footer class="footer"><div class="container"><p>© 2025 Společenství vlastníků Navigátorů 612-614</p></div></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <script src="app.js"></script>
  <script src="zavady.js"></script>
</body>
</html>
